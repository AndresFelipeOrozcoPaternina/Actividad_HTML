<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportHub - Iniciar Sesion</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>SportHub - Agenda Deportiva</h1>
        <nav>
            <a href="index.html">Volver al Inicio</a>
        </nav>
    </header>
    <hr>

    <main>
        <h2>Acceso de Administrador</h2>
        <p>Nota: Inicio de sesion simulado. Haz clic en "Ingresar" para continuar.</p>
        
        <form action="crear-evento.html" >
            <div>
                <label for="usuario">Usuario:</label><br>
                <input type="text" id="usuario"  required>
            </div>
            <br>
            <div>
                <label for="password">Contrasena:</label><br>
                <input type="password" id="password"  required>
            </div>
            <br>
            <button type="submit">Ingresar</button>
        </form>
    </main>
</body>
</html>
